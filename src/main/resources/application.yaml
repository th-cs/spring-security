spring:
  application:
    name: security
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
api:
  security:
    token:
      secret_key: ${TOKEN_SECRET_KEY}
server:
  port: 8080
